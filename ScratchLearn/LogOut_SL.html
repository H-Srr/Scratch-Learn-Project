<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Out - Learn Scratch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .logout-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .logout-container h2 {
            color: #9966FF;
            margin-bottom: 20px;
        }
        .logout-container p {
            color: #666;
        }
        .logout-container button {
            background-color: #9966FF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .logout-container button:hover {
            background-color: #7a4dcc;
        }
    </style>
</head>
<body>

    <div class="logout-container">
        <h2>Log Out</h2>
        <p>Are you sure you want to log out?</p>
        <button>Log Out</button>
    </div>

</body>
</html>
