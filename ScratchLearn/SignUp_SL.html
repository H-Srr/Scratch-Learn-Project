<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Learn Scratch</title>
    <link rel="StyleSheet" href="css/css.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#signupForm").submit(function (e) {
                e.preventDefault(); 

                const email = $("#email").val();
                const username = $("#username").val();
                const password = $("#password").val();
                const confirmPassword = $("#confirm_password").val();

                $.post("register.php", {
                    email: email,
                    username: username,
                    password: password,
                    confirm_password: confirmPassword
                }, function (response) {
                    if (response.trim() === "success") {
                        $("#error-msg").css("color", "green").text("✅ Registered successfully! Redirecting to login...");
                        setTimeout(() => {
                            window.location.href = "LogIn_SL.html"; // This redirects user to login
                        }, 2000);
                    } else {
                        $("#error-msg").css("color", "red").text(response);
                    }
                });
            });
        });
    </script>
</head>

<header style="position: fixed;">
    <nav>
        <a href="https://scratch.mit.edu/" target="_blank">
            <img src="imgs/Scratchlogo.png" alt="Scratch Logo" style="height: 40px; vertical-align: middle;">
        </a>
        <a href="LogIn_SL.html">Log in</a>
        <a href="SignUp_SL.html">Sign up</a>
        <a href="About_SL.html">About</a>
        <a href="Quizes.html">Quizzes</a>
        <a href="learnonyourown.html">Discover Scratch </a>
        <a href="feed.html">Leave a Feedback</a>
        <a href="Leaderboards.html">Leaderboards </a>
        <a href="SL_HomePage.html">
            <img src="imgs/home-icon-4.png" alt="home page" style="height: 40px; vertical-align: middle;">
        </a>
    </nav>
</header>

<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="logsi-container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Sign Up</button>
        </form>

        <p id="error-msg" style="margin-top: 10px;"></p>

        <a href="LogIn_SL.html">Already have an account? Log In</a>
    </div>

    <footer style="position: fixed;">
        <p style="text-align: center; color: #666;">© 2025 Sratch Learn</p>
    </footer>
    <img src="imgs/scratch-cat.png" alt="Scratch Cat" class="scratch-cat">
</body>
</html>
