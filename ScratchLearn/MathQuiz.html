    <div class="container">
        <h1>Math Quiz</h1>
        <h2>Choose the correct answer for each question.</h2>

        <form id="quizForm">
            <div class="question">
                <p>1. What is 3 × 4?</p>
                <div class="options">
                    <label><input type="radio" name="q1" value="10"> 10</label>
                    <label><input type="radio" name="q1" value="12"> 12</label>
                    <label><input type="radio" name="q1" value="15"> 15</label>
                </div>
            </div>

            <div class="question">
                <p>2. What is 8 ÷ 2?</p>
                <div class="options">
                    <label><input type="radio" name="q2" value="3"> 3</label>
                    <label><input type="radio" name="q2" value="4"> 4</label>
                    <label><input type="radio" name="q2" value="6"> 6</label>
                </div>
            </div>

            <div class="question">
                <p>3. What is 5 × 2?</p>
                <div class="options">
                    <label><input type="radio" name="q3" value="8"> 08</label>
                    <label><input type="radio" name="q3" value="10"> 10</label>
                    <label><input type="radio" name="q3" value="12"> 12</label>
                </div>
            </div>

            <div class="question">
                <p>4. What is 9 ÷ 3?</p>
                <div class="options">
                    <label><input type="radio" name="q4" value="2"> 2</label>
                    <label><input type="radio" name="q4" value="3"> 3</label>
                    <label><input type="radio" name="q4" value="4"> 4</label>
                </div>
            </div>

            <button type="button" onclick="checkMathQuiz()">Submit</button>
            <p class="result" id="mathResult"></p>
        </form>

        <p class="result" id="result"></p>

    </div>
